classes:
  - nsidc_nfs
  - nsidc_miniconda
  - awscli2

# mounts requested by Ops users
nsidc_nfs::sharemounts:
  /share/apps:
    project: apps
    options: rw

  /disks/restricted_ftp:
    project: restricted

  /disks/sidads_ftp:
    project: FTP

  /disks/sidads_staging:
    project: staging

  /share/logs/metgenc:
    project: logs
    share: "metgenc"
    options: rw

nsidc_nfs::nfsmounts:
  /disks/sftponly:
    nfsexport: /ifs/nfs/sftponly
    nfsserver: snowbox.apps.int.nsidc.org

nsidc_miniconda::install:
  /opt/miniconda:
    version: 'py312_25.3.1-1'
    python_version: '3'
    config:
      channels:
        anaconda_nsidc_main: true
        conda_forge: true
        extra:
          - nodefaults

awscli2::version: 'latest'
awscli2::ensure: 'present'
